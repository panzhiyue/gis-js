<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>
    <link href="template/third-party/cesium/Widgets/widgets.css" rel="stylesheet" type="text/css" />
    <script src="template/third-party/cesium/Cesium.js" type="text/javascript"></script>
    <script src="template/third-party/Sandcastle-header.js" type="text/javascript"></script>

    <script src="js/utilscesium.iife.js"></script>
</head>
<body>
    <!-- <h4 id="title"></h4>
    <div id="docs"></div> -->

    
<div id="map" style="width:100%;height:100%;">
  <div id="toolbar" class="cesium_toolbar">
    <div class="drawtoolbar">
      <div id="btnPolyline" title="画线"><span>画线</span></div>
      <div id="btnPolygon" title="画面"><span>画面</span></div>
      <div id="btnRectangle" title="矩形"><span>矩形</span></div>
      <div id="btnCircle" title="画圆"><span>圆</span></div>
    </div>
  </div>
</div>
<style>
  /*绘制工具Draw样式*/
  .cesium_toolbar {
    position: absolute;
    bottom: 145px;
    left: 25px;
    display: inline;
    background: #0f161c;
    z-index: 999;
    color: white;
  }
</style>

    <script type="module">
        ﻿const Polyline = utilscesium.Draw.Polyline;
const Polygon = utilscesium.Draw.Polygon;
const Rectangle = utilscesium.Draw.Rectangle;
const PolygonEditor = utilscesium.Editor.Polygon;
const PolylineEditor = utilscesium.Editor.Polyline;
const RectangleEditor = utilscesium.Editor.Rectangle;

Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjODdkODUxYy0wNmRjLTQxZjQtYWI4NC02NzVkNzg4ODViNDgiLCJpZCI6NDQ3NjMsImlhdCI6MTYxNDMyNjAzNH0.y_VCAXaJvJYUy8G2anXpNGInp8ozgwHuDx0ifoeFPVg";

let viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: true,
  geocoder: false,
  baseLayerPicker: false,
  timeline: false,
  fullscreenButton: true,
  scene3DOnly: true,
  infoBox: false,
  sceneModePicker: false,
  navigationInstructionsInitiallyVisible: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  // terrainProvider: Cesium.createWorldTerrain({}),
});

viewer._cesiumWidget._creditContainer.style.display = "none"; //去除版权信息
viewer.scene.globe.depthTestAgainstTerrain = false;
var tdt_key = "6703c18da8b111f1ac38fdcfc4a138d8";
var img_tdt = new Cesium.WebMapTileServiceImageryProvider({
  url: "http://t0.tianditu.com/img_w/wmts?tk=" + tdt_key,
  layer: "img",
  style: "default",
  tileMatrixSetID: "w",
  format: "tiles",
  maximumLevel: 18,
});
var layers = viewer.scene.imageryLayers;
var img_cia = new Cesium.WebMapTileServiceImageryProvider({
  url: "http://t0.tianditu.gov.cn/cia_w/wmts?tk=" + tdt_key,
  layer: "cia",
  style: "default",
  tileMatrixSetID: "w",
  format: "tiles",
  maximumLevel: 18,
});
layers.addImageryProvider(img_tdt);
layers.addImageryProvider(img_cia);



document.getElementById("btnPolyline").onclick = drawPolyline;
document.getElementById("btnPolygon").onclick = drawPolygon;
document.getElementById("btnRectangle").onclick = drawRectangle;
document.getElementById("btnCircle").onclick = drawCircle;

let draw = null;

function drawPolyline() {
  if (draw) {
    draw.setActive(false);
  }
  console.log(222);
  draw = new Polyline({
    enableRight: true,
  });
  draw.drawStart.addEventListener(function() {});
  draw.drawEnd.addEventListener(function(event) {
    let positions = event.positions;

    let entity = viewer.entities.add({
      polyline: {
        positions: positions,
        material: Cesium.Color.RED,
        width: 5,
        clampToGround: true,
      },
    });

    let editor = new PolylineEditor(viewer, entity);
    editor.start();
    draw.setActive(false);
  });
  draw.setViewer(viewer);
  draw.setActive(true);
}
function drawPolygon() {
  if (draw) {
    draw.setActive(false);
  }
  draw = new Polygon({
    enableRight: true,
  });
  draw.drawStart.addEventListener(function() {});
  draw.drawEnd.addEventListener(function(event) {
    let positions = event.positions;

    let entity = viewer.entities.add({
      polygon: {
        hierarchy: {
          positions: positions,
        },
        material: Cesium.Color.GREEN.withAlpha(1),
      },
    });

    let editor = new PolygonEditor(viewer, entity);
    editor.start();
    draw.setActive(false);
  });
  draw.setViewer(viewer);
  draw.setActive(true);
}

function drawRectangle() {
  if (draw) {
    draw.setActive(false);
  }
  draw = new Rectangle({
    enableRight: true,
  });
  draw.drawStart.addEventListener(function() {});
  draw.drawEnd.addEventListener(function(event) {
    let rect = event.rect;
    let entity = viewer.entities.add({
      rectangle: {
        coordinates: rect,
        material: Cesium.Color.BLACK.withAlpha(0.4),
        outline: true,
        outlineWidth: 2,
        outlineColor: Cesium.Color.RED,
        height: 0,
      },
    });

    let editor = new RectangleEditor(viewer, entity);
    editor.start();
    draw.setActive(false);
  });
  draw.setViewer(viewer);
  draw.setActive(true);
}

function drawCircle() {
  if (draw) {
    draw.setActive(false);
  }
  draw = new Circle({
    enableRight: true,
  });
  draw.drawStart.addEventListener(function() {});
  draw.drawEnd.addEventListener(function(event) {
    let position = event.position;
    let radius = event.radius;

    viewer.entities.add({
      position: position,
      ellipse: {
        semiMinorAxis: radius,
        semiMajorAxis: radius,
        material: Cesium.Color.BLACK.withAlpha(0.4),
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      },
    });
  });
  draw.setViewer(viewer);
  draw.setActive(true);
}
</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
