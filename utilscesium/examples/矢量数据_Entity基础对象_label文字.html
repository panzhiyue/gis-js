<!DOCTYPE html>
<html lang="en-US">
<head>

<div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,
  infoBox: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  baseLayerPicker: false,
  terrainProvider: Cesium.createWorldTerrain(),
});
// viewer.scene.globe.depthTestAgainstTerrain = true;
let view = {
  destination: Cesium.Rectangle.fromDegrees(
    119.05283765744,
    27.3397589411195,
    119.252892017179,
    27.3897617948041
  ),
  orientation: {
    heading: Cesium.Math.toRadians(0), //水平角度   //是当前方向 由北向东旋转的角度
    pitch: Cesium.Math.toRadians(-90), //俯视角度    //方向和水平平面的夹角,为正 表示方向向量指向水平平面上方，反之表示方向向量指向平面下方
    roll: 0, //是方向向量以正东方向为轴的旋转角度
  },
};
viewer.camera.setView(view);

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(
    119.05283765744,
    27.3397589411195,
    1000.94
  ),
  label: {
    text: "label文字",
    font: "24px Helvetica",
    fillColor: Cesium.Color.SKYBLUE,
    outlineColor: Cesium.Color.BLACK,
    outlineWidth: 2,
    horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
    visibleDepth: false,
  },
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(
    119.09283765744,
    27.3397589411195
  ),
  label: {
    text: "贴地文字",
    font: "25px Helvetica",
    fillColor: Cesium.Color.SKYBLUE,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
  },
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(
    119.13283765744,
    27.3397589411195,
    1000.94
  ),
  label: {
    text: "根据视距缩放文字",
    font: "25px Helvetica",
    fillColor: Cesium.Color.SKYBLUE,
    horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
    scaleByDistance: new Cesium.NearFarScalar(10000, 1.0, 500000, 0.1),
  },
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(
    119.20283765744,
    27.3397589411195,
    1000.94
  ),
  label: {
    text: "根据视距显示文字",
    font: "25px Helvetica",
    fillColor: Cesium.Color.SKYBLUE,
    outline: true,
    outlineColor: "#ffffff",
    outlineWidth: 2,
    distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0.0, 100000),
  },
});
</script>

        }
