<div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,
  infoBox: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  baseLayerPicker: false,
  terrainProvider: Cesium.createWorldTerrain(),
});

var scene = viewer.scene;

var localFrames = [
  {
    pos: Cesium.Cartesian3.fromDegrees(-123.075, 44.045, 5000.0),
    converter: Cesium.Transforms.eastNorthUpToFixedFrame,
    comments: "Classical East North Up\nlocal Frame",
  },
  {
    pos: Cesium.Cartesian3.fromDegrees(-123.075, 44.05, 5500.0),
    converter: Cesium.Transforms.localFrameToFixedFrameGenerator(
      "north",
      "west"
    ),
    comments: "North West Up\nlocal Frame",
  },
  {
    pos: Cesium.Cartesian3.fromDegrees(-123.075, 44.04, 4500.0),
    converter: Cesium.Transforms.localFrameToFixedFrameGenerator("south", "up"),
    comments: "South Up West\nlocal Frame",
  },
  {
    pos: Cesium.Cartesian3.fromDegrees(-123.075, 44.05, 4500.0),
    converter: Cesium.Transforms.localFrameToFixedFrameGenerator("up", "east"),
    comments: "Up East North\nlocal Frame",
  },
  {
    pos: Cesium.Cartesian3.fromDegrees(-123.075, 44.04, 5500.0),
    converter: Cesium.Transforms.localFrameToFixedFrameGenerator(
      "down",
      "east"
    ),
    comments: "Down East South\nlocal Frame",
  },
];

for (var i = 0; i < localFrames.length; i++) {
  var position = localFrames[i].pos;

  //绘制由变换为世界坐标的矩阵定义的参考系的坐标轴，
  // 即，地球的WGS84坐标。最突出的例子是原语模型矩阵。
  // X轴是红色的;Y是绿色的;Z是蓝色的。
  let p = scene.primitives.add(
    new utilscesium.Primitive.MatrixArrow({
      position: position,
      length: 300.0,
      width: 10.0,
    })
  );
}
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-123.075, 44.045, 5000.0),
});
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-123.075, 44.045, 7000.0),
});
</script>
