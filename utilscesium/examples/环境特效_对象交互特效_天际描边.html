<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>

    <title></title>
    <script src="js/utilscesium.iife.js"></script>
</head>
<body>
    <!-- <h4 id="title"></h4>
    <div id="docs"></div> -->

    <div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
  var viewer = new Cesium.Viewer('map', {
    animation: false,
    homeButton: false,
    fullscreenButton: false,
    geocoder: false,
    sceneModePicker: false,
    baseLayerPicker: false,
    timeline: false,
    infoBox: false,
    navigationHelpButton: false,
    selectionIndicator: false,
    terrainProvider: null,
    imageryProvider: false,
    baseLayerPicker: false

});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
    show: false
}));

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible"
}));

//加载地形
viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
    url: 'http://hzgzsoft.com:5681/data/terrain/china/'
})


var collection = viewer.scene.postProcessStages;

var edgeDetection = Cesium.PostProcessStageLibrary.createEdgeDetectionStage();

var postProccessStage = new Cesium.PostProcessStage({
    name: 'czm_skylinetemp',
    fragmentShader: 'uniform sampler2D colorTexture;' +
        'uniform sampler2D depthTexture;' +

        'varying vec2 v_textureCoordinates;' +

        'void main(void)' +
        '{' +
        'float depth = czm_readDepth(depthTexture, v_textureCoordinates);' +
        'vec4 color = texture2D(colorTexture, v_textureCoordinates);' +
        'if(depth<1.0 - 0.000001){' +
        'gl_FragColor = color;' +
        '}' +
        'else{' +
        'gl_FragColor = vec4(1.0,0.0,0.0,1.0);' +
        '}' +
        '}'
});

var postProccessStage1 = new Cesium.PostProcessStage({
    name: 'czm_skylinetemp1',
    fragmentShader: 'uniform sampler2D colorTexture;' +
        'uniform sampler2D redTexture;' +
        'uniform sampler2D silhouetteTexture;' +

        'varying vec2 v_textureCoordinates;' +

        'void main(void)' +
        '{' +
        'vec4 redcolor=texture2D(redTexture, v_textureCoordinates);' +
        'vec4 silhouetteColor = texture2D(silhouetteTexture, v_textureCoordinates);' +
        'vec4 color = texture2D(colorTexture, v_textureCoordinates);' +
        'if(redcolor.r == 1.0){' +
        'gl_FragColor = mix(color, vec4(1.0,0.0,0.0,1.0), silhouetteColor.a);' +
        '}' +
        'else{' +
        'gl_FragColor = color;' +
        '}' +
        '}',
    uniforms: {
        redTexture: postProccessStage.name,
        silhouetteTexture: edgeDetection.name
    }
});

var postProccessStage = new Cesium.PostProcessStageComposite({
    name: 'czm_skyline',
    stages: [edgeDetection, postProccessStage, postProccessStage1],
    inputPreviousStageTexture: false,
    uniforms: edgeDetection.uniforms
});

collection.add(postProccessStage);</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
