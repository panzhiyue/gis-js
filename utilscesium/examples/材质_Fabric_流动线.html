<body>

<div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";

var viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,
  infoBox: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  terrainProvider: null,
  imageryProvider: false,
  baseLayerPicker: false,
});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(
  new Cesium.WebMapTileServiceImageryProvider({
    url:
      "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
    show: false,
  })
);

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(
  new Cesium.WebMapTileServiceImageryProvider({
    url:
      "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
  })
);

const PolylineFlowMaterialProperty = utilscesium.Material.PolylineFlowMaterialProperty;
let entity = viewer.entities.add({
  polyline: {
    positions: new Cesium.CallbackProperty(() => {
      let length = getlength([
        [120, 28],
        [120, 29],
        [121, 29],
      ]);
      return Cesium.Cartesian3.fromDegreesArray([120, 28, 120, 29, 121, 29]);
    }, false),
    material: new PolylineFlowMaterialProperty({
      image: "./images/spriteline.png",
      color: Cesium.Color.WHITE,
      duration: 3000,
      repeat: {
        x: 1,
        y: 1,
      },
    }),
    width: 1.7,
  },
});

viewer.zoomTo(entity);

function getlength(coors) {
  var coors2 = [];
  for (let i = 0; i < coors.length; i++) {
    coors2.push(
      viewer.scene.cartesianToCanvasCoordinates(
        Cesium.Cartesian3.fromDegrees(coors[i][0], coors[i][1])
      )
    );
  }
  let length = 0;
  for (let i = 1; i < coors2.length; i++) {
    if (!coors2[i] || !coors2[i - 1]) {
      return 0;
    }
    let len = Math.sqrt(
      (coors2[i].x - coors2[i - 1].x) ** 2 +
        (coors2[i].y - coors2[i - 1].y) ** 2
    );
    length += len;
  }

  return length;
}
</script>
