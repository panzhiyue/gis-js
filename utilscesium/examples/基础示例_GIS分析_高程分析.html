<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">

<body>

<div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
  var viewer = new Cesium.Viewer('map', {
    animation: false,
    homeButton: false,
    fullscreenButton: false,
    geocoder: false,
    sceneModePicker: false,
    baseLayerPicker: false,
    timeline: false,
    infoBox: false,
    navigationHelpButton: false,
    selectionIndicator: false,
    terrainProvider: null,
    imageryProvider: false,
    baseLayerPicker: false

});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
    show: false
}));

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible"
}));
//加载地形
viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
    url: 'http://hzgzsoft.com:5681/data/terrain/china/'
})
viewer.scene.globe.depthTestAgainstTerrain = true;

var view = {
    //destination: Cesium.Cartesian3.fromDegrees(120.3, 26, 300000),   //坐标点
    destination: Cesium.Rectangle.fromDegrees(119.05283765744, 27.3397589411195, 119.252892017179, 27.3897617948041),
    orientation: {
        heading: Cesium.Math.toRadians(0), //水平角度   //是当前方向 由北向东旋转的角度
        pitch: Cesium.Math.toRadians(-30), //俯视角度    //方向和水平平面的夹角,为正 表示方向向量指向水平平面上方，反之表示方向向量指向平面下方
        roll: 0 //是方向向量以正东方向为轴的旋转角度
    }
};
viewer.camera.setView(view);



const viewModel = {
    gradient: false, // 渐变
    band1Position: 300,
    band2Position: 500,
    band3Position: 1000,
    bandThickness: 100, // 厚度
    bandTransparency: 0.5, // 透明度
    backgroundTransparency: 0.75, // 背景透明度
  };

  const updateMaterial = () => {
    const gradient = Boolean(viewModel.gradient);
    const band1Position = Number(viewModel.band1Position);
    const band2Position = Number(viewModel.band2Position);
    const band3Position = Number(viewModel.band3Position);
    const bandThickness = Number(viewModel.bandThickness);
    const bandTransparency = Number(viewModel.bandTransparency);
    const backgroundTransparency = Number(viewModel.backgroundTransparency);
  
    const layers = [];
    const backgroundLayer = {
      entries: [
        {
          height: 200.0,
          color: new Cesium.Color(0.0, 0.0, 0.2, backgroundTransparency),
        },
        {
          height: 800.0,
          color: new Cesium.Color(1.0, 1.0, 1.0, backgroundTransparency),
        },
        {
          height: 1500.0,
          color: new Cesium.Color(1.0, 0.0, 0.0, backgroundTransparency),
        },
      ],
      extendDownwards: true,
      extendUpwards: true,
    };
    layers.push(backgroundLayer);
    const gridStartHeight = 200.0;
    const gridEndHeight = 1500.0;
    const gridCount = 50;
  
    for (let i = 0; i < gridCount; i++) {
      const lerper = i / (gridCount - 1);
      // 计算两个高度的线性插值
      const heightBelow = Cesium.Math.lerp(
        gridStartHeight,
        gridEndHeight,
        lerper
      );
      const heightAbove = heightBelow + 10.0;
      const alpha = Cesium.Math.lerp(0.2, 0.4, lerper) * backgroundTransparency;
      layers.push({
        entries: [
          {
            height: heightBelow,
            color: new Cesium.Color(1.0, 1.0, 1.0, alpha),
          },
          {
            height: heightAbove,
            color: new Cesium.Color(1.0, 1.0, 1.0, alpha),
          },
        ],
      });
    }
  
    const antialias = Math.min(10.0, bandThickness * 0.1);
    if (!gradient) {
      const band1 = {
        entries: [
          {
            height: band1Position - bandThickness * 0.5 - antialias,
            color: new Cesium.Color(0.0, 0.0, 1.0, 0.0),
          },
          {
            height: band1Position - bandThickness * 0.5,
            color: new Cesium.Color(0.0, 0.0, 1.0, bandTransparency),
          },
          {
            height: band1Position + bandThickness * 0.5,
            color: new Cesium.Color(0.0, 0.0, 1.0, bandTransparency),
          },
          {
            height: band1Position + bandThickness * 0.5 + antialias,
            color: new Cesium.Color(0.0, 0.0, 1.0, 0.0),
          },
        ],
      };
  
      const band2 = {
        entries: [
          {
            height: band2Position - bandThickness * 0.5 - antialias,
            color: new Cesium.Color(0.0, 1.0, 0.0, 0.0),
          },
          {
            height: band2Position - bandThickness * 0.5,
            color: new Cesium.Color(0.0, 1.0, 0.0, bandTransparency),
          },
          {
            height: band2Position + bandThickness * 0.5,
            color: new Cesium.Color(0.0, 1.0, 0.0, bandTransparency),
          },
          {
            height: band2Position + bandThickness * 0.5 + antialias,
            color: new Cesium.Color(0.0, 1.0, 0.0, 0.0),
          },
        ],
      };
  
      const band3 = {
        entries: [
          {
            height: band3Position - bandThickness * 0.5 - antialias,
            color: new Cesium.Color(1.0, 0.0, 0.0, 0.0),
          },
          {
            height: band3Position - bandThickness * 0.5,
            color: new Cesium.Color(1.0, 0.0, 0.0, bandTransparency),
          },
          {
            height: band3Position + bandThickness * 0.5,
            color: new Cesium.Color(1.0, 0.0, 0.0, bandTransparency),
          },
          {
            height: band3Position + bandThickness * 0.5 + antialias,
            color: new Cesium.Color(1.0, 0.0, 0.0, 0.0),
          },
        ],
      };
  
      layers.push(band1);
      layers.push(band2);
      layers.push(band3);
    } else {
      const combinedBand = {
        entries: [
          {
            height: band1Position - bandThickness * 0.5,
            color: new Cesium.Color(0.0, 0.0, 1.0, bandTransparency),
          },
          {
            height: band2Position,
            color: new Cesium.Color(0.0, 1.0, 0.0, bandTransparency),
          },
          {
            height: band3Position + bandThickness * 0.5,
            color: new Cesium.Color(1.0, 0.0, 0.0, bandTransparency),
          },
        ],
      };
  
      layers.push(combinedBand);
    }
    const material = Cesium.createElevationBandMaterial({
      scene: viewer.scene,
      layers,
    });
    viewer.scene.globe.material = material;
  };

  updateMaterial()</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
