<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>
    <link href="template/third-party/cesium/Widgets/widgets.css" rel="stylesheet" type="text/css" />

    <title>创建地球</title>
    <script src="js/utilscesium.iife.js"></script>
</head>
<body>
    <!-- <h4 id="title">创建地球</h4>
    <div id="docs"><p>这个示例展示了如何在画布中添加一个点几何图形</p>
</div> -->

    
<div id="mapContainer" style="width:100%;height:100%;"></div>
<style>
  .marsBlueGradientPnl {
  text-align: center;
  padding: 5px 30px;
  margin: 0;
  color: #fff;
  background: linear-gradient(rgb(7 10 203 / 75%), rgb(16 238 220));
  -webkit-border-radius: 5px;
  -moz-border-radius: 5px;
  border-radius: 5px;
  max-height: 130px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  white-space: nowrap;
}

.marsBlueGradientPnl:after {
  content: "";
  position: absolute;
  bottom: -60px;
  left: calc(50% - 3px);
  display: block;
  width: 3px;
  height: 60px;
  border-right: 3px solid #2bcdbb;
}

.marsBlueGradientPnl-highlight {
  border: 2px solid yellow;
}
.marsBlueGradientPnl-highlight:after {
  border-right: 3px solid yellow;
}

</style>
    <script type="module">
        ﻿//设置token
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";

var viewer = new Cesium.Viewer("mapContainer", {
  animation: false, //如果设置为false，将不创建“动画”窗口小部件。
  homeButton: false, //如果设置为false，将不会创建HomeButton小部件。
  fullscreenButton: false, //如果设置为false，将不会创建FullscreenButton小部件。
  geocoder: false, //是否显示地名查找控件
  sceneModePicker: false, //是否显示投影方式控件
  baseLayerPicker: false, //如果设置为false，则不会创建BaseLayerPicker小部件。
  timeline: false, //是否显示时间线控件
  infoBox: false, //是否显示点击要素之后显示的信息
  navigationHelpButton: false, //如果设置为false，将不会创建导航帮助按钮。
  selectionIndicator: false, //如果设置为false，则不会创建SelectionIndicator小部件。
});

// 隐藏Cesium自身的logo
viewer._cesiumWidget._creditContainer.style.display = "none";

const DivPlane = utilscesium.Graphic.DivPlane;
const GraphicLayer = utilscesium.Layer.GraphicLayer;
const layer = new GraphicLayer({
  viewer: viewer,
});

const element = document.createElement("div");
element.className = "marsBlueGradientPnl";
element.innerHTML = "<div>我是Overlay</div>";
let graphic = new DivPlane({
  element: element,
  offset: [0, -70],
  positioning: "bottom-center",
  heading: -90,
  pitch: 0,
  roll: 90,
  scale: 20,
  horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
  verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
});
layer.addGraphic(graphic);
graphic.setPosition(Cesium.Cartesian3.fromDegrees(116.266763, 30.9272, 905.9));

// 将三维球定位到中国
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(116.318889, 30.769641, 7432.2),
  orientation: {
    heading: Cesium.Math.toRadians(1),
    pitch: Cesium.Math.toRadians(-19.6),
    roll: Cesium.Math.toRadians(0),
  },
  complete: function callback() {
    // 定位完成之后的回调函数
  },
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(116.266763, 30.9272, 905.9),
  point: {
    pixelSize: 10,
    color: Cesium.Color.YELLOW,
  },
});

setTimeout(() => {
  // layer.setViewer(null);
  layer.removeGraphic(graphic);
}, 2000);

setTimeout(() => {
  // layer.setViewer(viewer);
  layer.addGraphic(graphic);
}, 4000);
</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
