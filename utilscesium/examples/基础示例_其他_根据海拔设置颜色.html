<div id="map" style="width:100%;height:100%;"></div>
    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("map", {
  terrainProvider: new Cesium.CesiumTerrainProvider({
    url: "http://192.168.0.56:80/data/terrain/china/",
  }),
});

let view = {
  destination: Cesium.Rectangle.fromDegrees(
    119.05283765744,
    27.3397589411195,
    119.252892017179,
    27.3897617948041
  ),
  orientation: {
    heading: Cesium.Math.toRadians(0), //水平角度   //是当前方向 由北向东旋转的角度
    pitch: Cesium.Math.toRadians(-30), //俯视角度    //方向和水平平面的夹角,为正 表示方向向量指向水平平面上方，反之表示方向向量指向平面下方
    roll: 0, //是方向向量以正东方向为轴的旋转角度
  },
};
viewer.camera.setView(view);
var scene = viewer.scene;

var collection = viewer.scene.postProcessStages;

var edgeDetection = Cesium.PostProcessStageLibrary.createEdgeDetectionStage();

var postProccessStage = new Cesium.PostProcessStage({
  name: "czm_skylinetemp",
  fragmentShader:
    "uniform sampler2D colorTexture;" +
    "uniform sampler2D depthTexture;" +
    "varying vec2 v_textureCoordinates;" +
    "void main(void)" +
    "{" +
    "float depth = czm_readDepth(depthTexture, v_textureCoordinates);" +
    "vec4 color = texture2D(colorTexture, v_textureCoordinates);" +
    "if(depth<1.0 - 0.000001){" +
    "gl_FragColor = color;" +
    "}" +
    "else{" +
    "gl_FragColor = vec4(1.0,0.0,0.0,1.0);" +
    "}" +
    "}",
});

var postProccessStage1 = new Cesium.PostProcessStage({
  name: "czm_skylinetemp1",
  fragmentShader:
    "uniform sampler2D colorTexture;" +
    "uniform sampler2D redTexture;" +
    "uniform sampler2D silhouetteTexture;" +
    "varying vec2 v_textureCoordinates;" +
    "void main(void)" +
    "{" +
    "vec4 redcolor=texture2D(redTexture, v_textureCoordinates);" +
    "vec4 silhouetteColor = texture2D(silhouetteTexture, v_textureCoordinates);" +
    "vec4 color = texture2D(colorTexture, v_textureCoordinates);" +
    "if(redcolor.r == 1.0){" +
    "gl_FragColor = mix(color, vec4(1.0,0.0,0.0,1.0), silhouetteColor.a);" +
    "}" +
    "else{" +
    "gl_FragColor = color;" +
    "}" +
    "}",
  uniforms: {
    redTexture: postProccessStage.name,
    silhouetteTexture: edgeDetection.name,
  },
});

var postProccessStage = new Cesium.PostProcessStageComposite({
  name: "czm_skyline",
  stages: [edgeDetection, postProccessStage, postProccessStage1],
  inputPreviousStageTexture: false,
  uniforms: edgeDetection.uniforms,
});

collection.add(postProccessStage);
</script>
