    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("cesiumContainer", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,
  infoBox: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  baseLayerPicker: false,
  terrainProvider: Cesium.createWorldTerrain(),
});
var lat = 42.006;
var lon = 128.055;
viewer.scene.globe.depthTestAgainstTerrain = true;
//取消双击事件
viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(
  Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK
);
//设置homebutton的位置
Cesium.Camera.DEFAULT_VIEW_RECTANGLE = Cesium.Rectangle.fromDegrees(
  lon - 1,
  lat - 1,
  lon + 1,
  lat + 1
); //Rectangle(west, south, east, north)
//设置初始位置
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(lon, lat, 300000),
});

/*
  流动纹理线
   color 颜色
   duration 持续时间 毫秒
*/
function PolylineTrailLinkMaterialProperty(color, duration) {
  this._definitionChanged = new Cesium.Event();
  this._color = undefined;
  this._colorSubscription = undefined;
  this.color = color;
  this.duration = duration;
  this._time = new Date().getTime();
}
Cesium.defineProperties(PolylineTrailLinkMaterialProperty.prototype, {
  isConstant: {
    get: function() {
      return false;
    },
  },
  definitionChanged: {
    get: function() {
      return this._definitionChanged;
    },
  },
  color: Cesium.createPropertyDescriptor("color"),
});
PolylineTrailLinkMaterialProperty.prototype.getType = function(time) {
  return "PolylineTrailLink";
};
PolylineTrailLinkMaterialProperty.prototype.getValue = function(time, result) {
  if (!Cesium.defined(result)) {
    result = {};
  }
  result.color = Cesium.Property.getValueOrClonedDefault(
    this._color,
    time,
    Cesium.Color.WHITE,
    result.color
  );
  result.image = Cesium.Material.PolylineTrailLinkImage;
  result.time =
    ((new Date().getTime() - this._time) % this.duration) / this.duration;
  return result;
};
PolylineTrailLinkMaterialProperty.prototype.equals = function(other) {
  return (
    this === other ||
    (other instanceof PolylineTrailLinkMaterialProperty &&
      Property.equals(this._color, other._color))
  );
};
Cesium.PolylineTrailLinkMaterialProperty = PolylineTrailLinkMaterialProperty;
Cesium.Material.PolylineTrailLinkType = "PolylineTrailLink";
Cesium.Material.PolylineTrailLinkImage = "./images/poly-rivers.png"; //colors
Cesium.Material.PolylineTrailLinkSource =
  "czm_material czm_getMaterial(czm_materialInput materialInput)\n\
                                              {\n\
                                                   czm_material material = czm_getDefaultMaterial(materialInput);\n\
                                                   vec2 st = materialInput.st;\n\
                                                   vec4 colorImage = texture2D(image, vec2(fract(st.s - time), st.t));\n\
                                                   material.alpha = colorImage.a * color.a;\n\
                                                   material.diffuse = (colorImage.rgb+color.rgb)/2.0;\n\
                                                   return material;\n\
                                               }";
Cesium.Material._materialCache.addMaterial(
  Cesium.Material.PolylineTrailLinkType,
  {
    fabric: {
      type: Cesium.Material.PolylineTrailLinkType,
      uniforms: {
        color: new Cesium.Color(1.0, 0.0, 0.0, 0.5),
        image: Cesium.Material.PolylineTrailLinkImage,
        time: 0,
      },
      source: Cesium.Material.PolylineTrailLinkSource,
    },
    translucent: function(material) {
      return true;
    },
  }
);
let entity;
var isAdd = false;
function setvisible(value) {
  switch (value) {
    case "position":
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, 300000),
      });
      break;
    case "add":
      if (!isAdd) {
        entity = viewer.entities.add({
          name: "PolylineTrail",
          polyline: {
            positions: Cesium.Cartesian3.fromDegreesArrayHeights([
              lon,
              lat,
              2500,
              lon + 10,
              lat,
              2500,
              lon + 10,
              lat + 10,
              2500,
            ]),
            width: 50,
            material: new Cesium.PolylineTrailLinkMaterialProperty(
              //   Cesium.Color.fromCssColorString("rgba(0,0,0,1)"),
              Cesium.Color.BLUE.withAlpha(0.5),
              10000
            ),
          },
        });
        isAdd = true;
      }
      break;
    case "del":
      if (isAdd) {
        viewer.entities.remove(entity);
        isAdd = false;
      }
      break;
  }
}

window.setvisible = setvisible;
</script>
