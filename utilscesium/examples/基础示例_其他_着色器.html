<div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
  var viewer = initCesium("map", {
    terrainProvider: Cesium.createWorldTerrain({
        requestWaterMask: true,
        requestVertexNormals: true
    })
});
//高程遮挡
viewer.scene.globe.depthTestAgainstTerrain = true;
let v = `
                                                                 attribute vec3 position3DHigh;
                                                                 attribute vec3 position3DLow;
                                                                 // attribute vec3 position2DHigh;
                                                                 // attribute vec3 position2DLow;
                                                                 attribute vec4 color;
                                                                 varying vec4 v_color;
                                                                 attribute float batchId;
                                                                 void main()
                                                                 {
                                                                   //vec4 p = czm_translateRelativeToEye(position3DHigh, position3DLow);
                                                                    vec4 p = czm_computePosition();  //The position relative to eye
                                                                    v_color =color;
                                                                    p = czm_modelViewProjectionRelativeToEye * p;
                                                                    gl_Position=p;
                                                                   // gl_Position =  czm_modelViewProjectionRelativeToEye * p;
                                                                    gl_PointSize=20.0;
                                                                 }`
let f = `  varying vec4 v_color;
                                                                     void main()
                                                                     {
                                                                           float d = distance(gl_PointCoord, vec2(0.5,0.5));
                                                                          if(d < 0.5){
                                                                             gl_FragColor = v_color;
                                                                          }else{
                                                                             discard;
                                                                          }
                                                                     }`
var appearance = new Cesium.Appearance({
    renderState: {
        blending: Cesium.BlendingState.PRE_MULTIPLIED_ALPHA_BLEND,  //混合
        depthTest: { enabled: true }, //深度测试
        depthMask: true
    },
    fragmentShaderSource: f,
    vertexShaderSource: v
});

viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(-105.0, 33.55, 3000000)
});


var polygonWithHole = new Cesium.PolygonGeometry({
    polygonHierarchy: new Cesium.PolygonHierarchy(
        Cesium.Cartesian3.fromDegreesArray([
            -109.0, 30.0,
            -95.0, 30.0,
            -95.0, 40.0,
            -109.0, 40.0
        ]),
        [new Cesium.PolygonHierarchy(
            Cesium.Cartesian3.fromDegreesArray([
                -107.0, 31.0,
                -107.0, 39.0,
                -97.0, 39.0,
                -97.0, 31.0
            ]),
            [new Cesium.PolygonHierarchy(
                Cesium.Cartesian3.fromDegreesArray([
                    -105.0, 33.0,
                    -99.0, 33.0,
                    -99.0, 37.0,
                    -105.0, 37.0
                ]),
                [new Cesium.PolygonHierarchy(
                    Cesium.Cartesian3.fromDegreesArray([
                        -103.0, 34.0,
                        -101.0, 34.0,
                        -101.0, 36.0,
                        -103.0, 36.0
                    ])
                )]
            )]
        )]
    )
});
var geometry = Cesium.PolygonGeometry.createGeometry(polygonWithHole);

viewer.scene.primitives.add(new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
        geometry: geometry
    }),
    appearance: appearance,
    asynchronous: false
}));</script>
