<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>
    <link href="template/third-party/cesium/Widgets/widgets.css" rel="stylesheet" type="text/css" />
    <script src="template/third-party/cesium/Cesium.js" type="text/javascript"></script>
    <script src="template/third-party/Sandcastle-header.js" type="text/javascript"></script>
    <!-- <script type="text/javascript" cesium="true" src="https://api.tianditu.gov.cn/cdn/plugins/cesium/Cesium_ext_min.js"></script> -->
    
    <title></title>
    <script src="js/utilscesium.iife.js"></script>
</head>
<body>
    <!-- <h4 id="title"></h4>
    <div id="docs"></div> -->

    <div id="map" style="width:100%;height:100%;"></div>

    <script type="module">
        ﻿const ToolBar =utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
  var viewer = new Cesium.Viewer('map', {
    animation: false,
    homeButton: false,
    fullscreenButton: false,
    geocoder: false,
    sceneModePicker: false,
    baseLayerPicker: false,
    timeline: false,
    infoBox: false,
    navigationHelpButton: false,
    selectionIndicator: false,
    terrainProvider: null,
    imageryProvider: false,
    baseLayerPicker: false

});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
    show: false
}));

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible"
}));
//加载地形
viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
    url: 'http://hzgzsoft.com:5681/data/terrain/china/'
});

//红色面
var redPolygon = viewer.entities.add({
    name: "Red polygon on surface",
    polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([-115.0,
            37.0, -115.0,
            32.0, -107.0,
            33.0, -102.0,
            31.0, -102.0,
            35.0
        ]),
        material: Cesium.Color.RED
    }
});

var greenPolygon = viewer.entities.add({
    name: "Green extruded polygon",
    polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([-108.0,
            42.0, -100.0,
            42.0, -104.0,
            40.0,
        ]),
        extrudedHeight: 500000.0,
        material: Cesium.Color.GREEN,
        closeTop: false,
        closeBottom: false
    }
});

var orangePolygon = viewer.entities.add({
    name: "Orange polygon with per-position heights and outline",
    polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights([-108.0,
            25.0,
            100000, -100.0,
            25.0,
            100000, -100.0,
            30.0,
            100000, -108.0,
            30.0,
            300000
        ]),
        extrudedHeight: 0,
        perPositionHeight: true,
        material: Cesium.Color.ORANGE.withAlpha(0.5),
        outline: true,
        outlineColor: Cesium.Color.BLACK
    }
});

var bluePolygon = viewer.entities.add({
    name: "Blue polygon with holes",
    polygon: {
        hierarchy: {
            positions: Cesium.Cartesian3.fromDegreesArray([-99.0,
                30.0, -85.0,
                30.0, -85.0,
                40.0, -99.0,
                40.0
            ]),
            holes: [{
                positions: Cesium.Cartesian3.fromDegreesArray([-97.0,
                    31.0, -97.0,
                    39.0, -87.0,
                    39.0, -87.0,
                    31.0
                ]),
                holes: [{
                    positions: Cesium.Cartesian3.fromDegreesArray([-95.0,
                        33.0, -89.0,
                        33.0, -89.0,
                        37.0, -95.0,
                        37.0
                    ]),
                    holes: [{
                        positions: Cesium.Cartesian3.fromDegreesArray([-93.0,
                            34.0, -91.0,
                            34.0, -91.0,
                            36.0, -93.0,
                            36.0
                        ])
                    }]
                }]
            }]
        },
        material: Cesium.Color.BLUE.withAlpha(0.5),
        height: 0,
        outline: true, // height is required for outline to display
    }
});

var cyanPolygon = viewer.entities.add({
    name: "Cyan vertical polygon with per-position heights and outline",
    polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights([-90.0,
            41.0,
            0.0, -85.0,
            41.0,
            500000.0, -80.0,
            41.0,
            0.0
        ]),
        perPositionHeight: true,
        material: Cesium.Color.CYAN.withAlpha(0.5),
        outline: true,
        outlineColor: Cesium.Color.BLACK
    }
});

var purplePolygonUsingRhumbLines = viewer.entities.add({
    name: "Purple polygon using rhumb lines with outline",
    polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([-120.0,
            45.0, -80.0,
            45.0, -80.0,
            55.0, -120.0,
            55.0
        ]),
        extrudedHeight: 50000,
        material: Cesium.Color.PURPLE,
        outline: true,
        outlineColor: Cesium.Color.MAGENTA,
        arcType: Cesium.ArcType.RHUMB
    }
});</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
