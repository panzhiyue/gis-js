<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>

<body>

<div id="map" style="width:100%;height:100%;">
  <div id="toolbar" style="position: absolute; z-index: 10; background: rgba(42, 42, 42, 0.8);
  padding: 4px; border-radius: 4px; margin: 5px; color: #fff; font-size: 14px;
  font-family: 微软雅黑;">
      <div id="viewChangDiegoed">View Changed</div>
      <div id="cameraChanged">Camera Changed</div>
  </div>
</div>

    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,
  infoBox: false,
  navigationHelpButton: false,
  selectionIndicator: false,
  terrainProvider: null,
  imageryProvider: false,
  baseLayerPicker: false,
});

var scene = viewer.scene;
var clock = viewer.clock;
var referenceFramePrimitive;

//飞行到圣地亚哥
function flyToSanDiego() {
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(-117.16, 32.71, 15000.0),
  });
}

function flyToHeadingPitchRoll() {
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(-122.22, 46.12, 5000.0),
    orientation: {
      heading: Cesium.Math.toRadians(20.0),
      pitch: Cesium.Math.toRadians(-35.0),
      roll: 0.0,
    },
  });
}

//飞行到当前位置
function flyToLocation() {
  // Create callback for browser's geolocation
  function fly(position) {
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(
        position.coords.longitude,
        position.coords.latitude,
        1000.0
      ),
    });
  }

  // Ask browser for location, and fly there.
  navigator.geolocation.getCurrentPosition(fly);
}

function viewRectangle() {
  var west = -77.0;
  var south = 38.0;
  var east = -72.0;
  var north = 42.0;

  var rectangle = Cesium.Rectangle.fromDegrees(west, south, east, north);
  viewer.camera.setView({
    destination: rectangle,
  });

  // Show the rectangle.  Not required; just for show.
  viewer.entities.add({
    rectangle: {
      coordinates: rectangle,
      fill: false,
      outline: true,
      outlineColor: Cesium.Color.WHITE,
    },
  });
}

function flyToRectangle() {
  var west = -90.0;
  var south = 38.0;
  var east = -87.0;
  var north = 40.0;
  var rectangle = Cesium.Rectangle.fromDegrees(west, south, east, north);

  viewer.camera.flyTo({
    destination: rectangle,
  });

  // Show the rectangle.  Not required; just for show.
  viewer.entities.add({
    rectangle: {
      coordinates: rectangle,
      fill: false,
      outline: true,
      outlineColor: Cesium.Color.WHITE,
    },
  });
}

function setReferenceFrame() {
  var center = Cesium.Cartesian3.fromDegrees(-75.59777, 40.03883);
  var transform = Cesium.Transforms.eastNorthUpToFixedFrame(center);

  // View in east-north-up frame
  var camera = viewer.camera;
  camera.constrainedAxis = Cesium.Cartesian3.UNIT_Z;
  camera.lookAtTransform(
    transform,
    new Cesium.Cartesian3(-120000.0, -120000.0, 120000.0)
  );

  // Show reference frame.  Not required.
  referenceFramePrimitive = scene.primitives.add(
    new Cesium.DebugModelMatrixPrimitive({
      modelMatrix: transform,
      length: 100000.0,
    })
  );
}

function setHeadingPitchRoll() {
  var camera = viewer.camera;
  camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(-75.5847, 40.0397, 1000.0),
    orientation: {
      heading: -Cesium.Math.PI_OVER_TWO,
      pitch: -Cesium.Math.PI_OVER_FOUR,
      roll: 0.0,
    },
  });
}

function icrf(scene, time) {
  if (scene.mode !== Cesium.SceneMode.SCENE3D) {
    return;
  }

  var icrfToFixed = Cesium.Transforms.computeIcrfToFixedMatrix(time);
  if (Cesium.defined(icrfToFixed)) {
    var camera = viewer.camera;
    var offset = Cesium.Cartesian3.clone(camera.position);
    var transform = Cesium.Matrix4.fromRotationTranslation(icrfToFixed);
    camera.lookAtTransform(transform, offset);
  }
}

function viewInICRF() {
  viewer.camera.flyHome(0);

  clock.multiplier = 3 * 60 * 60;
  scene.postUpdate.addEventListener(icrf);
  scene.globe.enableLighting = true;
}

var viewChanged = document.getElementById("viewChanged");

var removeStart;
var removeEnd;

function cameraEvents() {
  var camera = viewer.camera;
  removeStart = camera.moveStart.addEventListener(function() {
    viewChanged.style.display = "block";
  });
  removeEnd = camera.moveEnd.addEventListener(function() {
    viewChanged.style.display = "none";
  });
}

var cameraChanged = document.getElementById("cameraChanged");

var removeChanged;

function cameraChanges() {
  var i = 0;
  removeChanged = viewer.camera.changed.addEventListener(function(percentage) {
    ++i;
    cameraChanged.innerText =
      "Camera Changed: " + i + ", " + percentage.toFixed(6);
    cameraChanged.style.display = "block";
  });
}

function flyInACity() {
  var camera = scene.camera;
  camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(
      -73.98580932617188,
      40.74843406689482,
      363.34038727246224
    ),
    complete: function() {
      setTimeout(function() {
        camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            -73.98585975679403,
            40.75759944127251,
            186.50838555841779
          ),
          orientation: {
            heading: Cesium.Math.toRadians(200.0),
            pitch: Cesium.Math.toRadians(-50.0),
          },
          easingFunction: Cesium.EasingFunction.LINEAR_NONE,
        });
      }, 1000);
    },
  });
}

function losAngelesToTokyo(adjustPitch) {
  var camera = scene.camera;

  var tokyoOptions = {
    destination: Cesium.Cartesian3.fromDegrees(139.8148, 35.7142, 20000.0),
    orientation: {
      heading: Cesium.Math.toRadians(15.0),
      pitch: Cesium.Math.toRadians(-60),
      roll: 0.0,
    },
    duration: 20,
    flyOverLongitude: Cesium.Math.toRadians(60.0),
  };

  var laOptions = {
    destination: Cesium.Cartesian3.fromDegrees(-117.729, 34.457, 10000.0),
    duration: 5,
    orientation: {
      heading: Cesium.Math.toRadians(-15.0),
      pitch: -Cesium.Math.PI_OVER_FOUR,
      roll: 0.0,
    },
  };

  laOptions.complete = function() {
    setTimeout(function() {
      camera.flyTo(tokyoOptions);
    }, 1000);
  };

  if (adjustPitch) {
    tokyoOptions.pitchAdjustHeight = 1000;
    laOptions.pitchAdjustHeight = 1000;
  }

  camera.flyTo(laOptions);
}

function flyOverLongitude(adjustPitch) {
  losAngelesToTokyo();
}

function flyOverLongitudeWithPitch() {
  losAngelesToTokyo(true);
}

new ToolBar(document.getElementById("toolbar")).addMenus([
  {
    name: "show",
    menuType: ToolBar.MenuType.SELECT,
    values: [
      "Camera Options",
      "Fly in a city",
      "Fly to San Diego",
      "Fly to Location with heading, pitch and roll",
      "Fly to My Location",
      "Fly to Rectangle",
      "View a Rectangle",
      "Set camera reference frame",
      "Set camera with heading, pitch, and roll",
      "View in ICRF",
      "Move events",
      "Camera changed event",
      "Fly from Los Angeles to Tokyo via Europe",
      "Look down during exaggerated flight",
    ],
    defaultValue: "Camera Options",
    onchange: function(event) {
      switch (event.currentTarget.value) {
        case "Fly in a city": {
          flyInACity();
          break;
        }
        case "Fly to San Diego": {
          flyToSanDiego();
          break;
        }
        case "Fly to Location with heading, pitch and roll": {
          flyToHeadingPitchRoll();
          break;
        }
        case "Fly to My Location": {
          flyToLocation();
          break;
        }
        case "Fly to Rectangle": {
          flyToRectangle();
          break;
        }
        case "View a Rectangle": {
          viewRectangle();
          break;
        }
        case "Set camera reference frame": {
          setReferenceFrame();
          break;
        }
        case "Set camera with heading, pitch, and roll": {
          setHeadingPitchRoll();
          break;
        }
        case "View in ICRF": {
          viewInICRF();
          break;
        }
        case "Move events": {
          cameraEvents();
          break;
        }
        case "Camera changed event": {
          cameraChanges();
          break;
        }
        case "Fly from Los Angeles to Tokyo via Europe": {
          flyOverLongitude();
          break;
        }
        case "Look down during exaggerated flight": {
          flyOverLongitudeWithPitch();
          break;
        }
      }
    },
  },
]);
</script>
