    <script type="module">
        ﻿const ToolBar = utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
var viewer = new Cesium.Viewer("map", {
  animation: false,
  homeButton: false,
  fullscreenButton: false,
  geocoder: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  timeline: false,

  terrainProvider: null,
  imageryProvider: false,
  baseLayerPicker: false,
});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(
  new Cesium.WebMapTileServiceImageryProvider({
    url:
      "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",

    tileMatrixSetID: "GoogleMapsCompatible",
    show: false,
  })
);

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(
  new Cesium.WebMapTileServiceImageryProvider({
    url:
      "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
  })
);

//加载地形
viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
  url: "http://hzgzsoft.com:5681/data/terrain/china/",
});

var draw = new Polygon();
draw.drawStart.addEventListener(function() {
  console.log(11);
});

draw.drawEnd.addEventListener(function(event) {
  var points = event.positions;
  console.log(points);
  // 逆时针方向采集
  //var points = [
  //    new Cesium.Cartesian3(-1715292.6999753984, 4993153.157628936, 3566663.752912529),
  //    new Cesium.Cartesian3(-1715285.8150713604, 4993167.072601330, 3566647.6921528564),
  //    new Cesium.Cartesian3(-1715286.5985765400, 4993181.309761941, 3566627.519787549),
  //    new Cesium.Cartesian3(-1715299.0249209427, 4993191.177501195, 3566607.861264360),
  //    new Cesium.Cartesian3(-1715349.5762367432, 4993176.675656664, 3566603.878289345),
  //    new Cesium.Cartesian3(-1715375.5538853381, 4993159.990032478, 3566614.671147202),
  //    new Cesium.Cartesian3(-1715370.1945772346, 4993141.041835706, 3566643.580587877),
  //    new Cesium.Cartesian3(-1715359.7019716015, 4993131.063945592, 3566662.468046927),
  //    new Cesium.Cartesian3(-1715321.9141253997, 4993137.762602262, 3566671.205164391)
  //];

  var pointsLength = points.length;

  var clippingPlanes = [];
  for (var i = 0; i < pointsLength; ++i) {
    var nextIndex = (i + 1) % pointsLength;
    var midpoint = Cesium.Cartesian3.add(
      points[i],
      points[nextIndex],
      new Cesium.Cartesian3()
    );

    midpoint = Cesium.Cartesian3.multiplyByScalar(midpoint, 0.5, midpoint);

    var up = Cesium.Cartesian3.normalize(midpoint, new Cesium.Cartesian3());
    var right = Cesium.Cartesian3.subtract(
      points[nextIndex],
      midpoint,
      new Cesium.Cartesian3()
    );
    right = Cesium.Cartesian3.normalize(right, right);
    var normal = Cesium.Cartesian3.cross(right, up, new Cesium.Cartesian3());
    if (isNaN(normal.x)) {
      continue;
    }
    console.log(normal);
    normal = Cesium.Cartesian3.normalize(normal, normal);

    var originCenteredPlane = new Cesium.Plane(normal, 0.0);
    var distance = Cesium.Plane.getPointDistance(originCenteredPlane, midpoint);

    clippingPlanes.push(new Cesium.ClippingPlane(normal, distance));
  }

  viewer.scene.globe.clippingPlanes = new Cesium.ClippingPlaneCollection({
    planes: clippingPlanes,
    edgeWidth: 1.0,
    edgeColor: Cesium.Color.BLACK,
  });

  //viewer.camera.lookAt(new Cesium.Cartesian3(-1715298.755222242, 4993163.868150364, 3566670.284367589),
  //    new Cesium.HeadingPitchRange(0, -Cesium.Math.toRadians(90), 10000));
});
draw.setViewer(viewer);
draw.setActive(true);
</script>
