<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script src="js/extend/jquery.js"></script>
    <link href="template/third-party/cesium/Widgets/widgets.css" rel="stylesheet" type="text/css" />
    <script src="template/third-party/cesium/Cesium.js" type="text/javascript"></script>
    <script src="template/third-party/Sandcastle-header.js" type="text/javascript"></script>
    <!-- <script type="text/javascript" cesium="true" src="https://api.tianditu.gov.cn/cdn/plugins/cesium/Cesium_ext_min.js"></script> -->
    
    <title></title>
    <script src="js/utilscesium.iife.js"></script>
</head>
<body>
    <!-- <h4 id="title"></h4>
    <div id="docs"></div> -->

    <div id="toolbar" style="position: absolute; z-index: 10; background: rgba(42, 42, 42, 0.8);
        padding: 4px; border-radius: 4px; margin: 5px; color: #fff; font-size: 14px;
        font-family: 微软雅黑;">
    </div>
    <div id="scaleByDistance" style="position: absolute; z-index: 10; background: rgba(42, 42, 42, 0.8);
        padding: 4px; border-radius: 4px; margin: 5px; color: #fff; font-size: 14px;
        font-family: 微软雅黑; top: 200px;">
        <div>
            scaleByDistance</div>
    </div>
    <div id="translucencyByDistance" style="position: absolute; z-index: 10; background: rgba(42, 42, 42, 0.8);
        padding: 4px; border-radius: 4px; margin: 5px; color: #fff; font-size: 14px;
        font-family: 微软雅黑; top: 380px;">
        <div>
            translucencyByDistance</div>
    </div>
    <div id="distanceDisplayCondition" style="position: absolute; z-index: 10; background: rgba(42, 42, 42, 0.8);
        padding: 4px; border-radius: 4px; margin: 5px; color: #fff; font-size: 14px;
        font-family: 微软雅黑; top: 0px; left: 500px;">
        <div>
            distanceDisplayCondition</div>
    </div>
<div id="map" style="width:100%;height:100%;">
</div>

    <script type="module">
        ﻿const ToolBar =utilscesium.Control.ToolBar;
Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNmZlMThiNC05MjZjLTRhMzQtYjk1NC04Mzk1OWUzNGQyNDYiLCJpZCI6MTE2NjEsInNjb3BlcyI6WyJhc2wiLCJhc3IiLCJhc3ciLCJnYyJdLCJpYXQiOjE1NTk1NTEwODh9.1sP9cG15Apatkf1x1g1_P_86wc3gFNOZM66XoWLUsxc";
  var viewer = new Cesium.Viewer('map', {
    animation: false,
    homeButton: false,
    fullscreenButton: false,
    geocoder: false,
    sceneModePicker: false,
    baseLayerPicker: false,
    timeline: false,
    infoBox: false,
    navigationHelpButton: false,
    selectionIndicator: false,
    terrainProvider: null,
    imageryProvider: false,
    baseLayerPicker: false

});

//全球影像地图服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtBasicLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible",
    show: false
}));

//全球影像中文注记服务
viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
    url: "http://t0.tianditu.com/cva_w/wmts?service=wmts&request=GetTile&version=1.0.0&LAYER=cva&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default.jpg&tk=6703c18da8b111f1ac38fdcfc4a138d8",
    layer: "tdtAnnoLayer",
    style: "default",
    format: "image/jpeg",
    tileMatrixSetID: "GoogleMapsCompatible"
}));
//加载地形
viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
    url: 'http://hzgzsoft.com:5681/data/terrain/china/'
});

viewer.scene.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(119.05283765744, 27.3397589411195, 2000000),
    endTransform: Cesium.Matrix4.IDENTITY
});
viewer.scene.globe.depthTestAgainstTerrain = true;

var entity = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(119.05283765744, 27.3397589411195),
    point: {
        show: true, //true:显示,false:隐藏
        pixelSize: 10, //大小(不包括边框)
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, //地形属性
        color: Cesium.Color.YELLOW, //填充色
        outlineColor: Cesium.Color.RED, //边框色
        outlineWidth: 2, //边框宽度
        scaleByDistance: new Cesium.NearFarScalar(1.5e2, 1.5, 8.0e6, 0), //（近值，近端放大率，远值，远端放大率） 给定距离视点的近值和远值，以及对应的两个近端放大率和远端放大率。当距离在近值和远值之间时，放大/缩小倍数在两个放大两率之间递增。超出这个范围后，放大率保持不变
        translucencyByDistance: new Cesium.NearFarScalar(1.5e2, 1.5, 8.0e6, 0), //根据相机距离设置透明度
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 500000000), //指定此点将显示在指定区间内(相机高度)
        disableDepthTestDistance: 50000000 //相机距离小于指定值不会被遮挡
    }
});
console.log(entity.point.scaleByDistance._value);
new ToolBar(document.getElementById("toolbar")).addMenus([{
        name: "show",
        menuType: ToolBar.MenuType.CHECKBOX,
        defaultValue: entity.point.show,
        onchange: function(event) {
            entity.point.show = event.currentTarget.checked;
        }
    }, {
        name: "pixelSize",
        menuType: ToolBar.MenuType.RANGE,
        minValue: 1,
        maxValue: 200,
        step: 1,
        defaultValue: entity.point.pixelSize,
        onchange: function(event) {
            entity.point.pixelSize = event.currentTarget.value;

        }
    }, {
        name: "heightReference",
        menuType: ToolBar.MenuType.ENUM,
        values: Cesium.HeightReference,
        defaultValue: entity.point.heightReference,
        onchange: function(event) {
            entity.point.heightReference = Cesium.HeightReference[event.currentTarget.value];

        }
    }, {
        name: "color",
        menuType: ToolBar.MenuType.ENUM,
        values: Cesium.Color,
        defaultValue: entity.point.color,
        onchange: function(event) {
            entity.point.color = Cesium.Color[event.currentTarget.value];
        }
    }, {
        name: "outlineColor",
        menuType: ToolBar.MenuType.ENUM,
        values: Cesium.Color,
        defaultValue: entity.point.outlineColor,
        onchange: function(event) {
            entity.point.outlineColor = Cesium.Color[event.currentTarget.value];

        }
    }, {
        name: "outlineWidth",
        menuType: ToolBar.MenuType.RANGE,
        minValue: 1,
        maxValue: 200,
        step: 1,
        defaultValue: entity.point.outlineWidth,
        onchange: function(event) {
            entity.point.outlineWidth = event.currentTarget.value;

        }
    },

    {
        name: "disableDepthTestDistance",
        menuType: ToolBar.MenuType.RANGE,
        minValue: 1,
        maxValue: 5000000,
        step: 1,
        defaultValue: entity.point.disableDepthTestDistance,
        onchange: function(event) {
            entity.point.disableDepthTestDistance = event.currentTarget.value;

        }
    }

]);
//#region scaleByDistance
new ToolBar(document.getElementById("scaleByDistance")).addMenus([{
    name: "near",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.scaleByDistance._value.near,
    onchange: function(event) {
        entity.point.scaleByDistance._value.near = event.currentTarget.value;

    }
}, {
    name: "nearValue",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.scaleByDistance._value.nearValue,
    onchange: function(event) {
        entity.point.scaleByDistance._value.nearValue = event.currentTarget.value;

    }
}, {
    name: "far",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.scaleByDistance._value.far,
    onchange: function(event) {
        entity.point.scaleByDistance._value.far = event.currentTarget.value;

    }
}, {
    name: "farValue",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.scaleByDistance._value.farValue,
    onchange: function(event) {
        entity.point.scaleByDistance._value.farValue = event.currentTarget.value;

    }
}]);
//#endregion
//#region translucencyByDistance


new ToolBar(document.getElementById("translucencyByDistance")).addMenus([{
    name: "near",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.translucencyByDistance._value.near,
    onchange: function(event) {
        entity.point.translucencyByDistance._value.near = event.currentTarget.value;

    }
}, {
    name: "nearValue",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 10,
    step: 0,
    defaultValue: entity.point.translucencyByDistance._value.nearValue,
    onchange: function(event) {
        entity.point.translucencyByDistance._value.nearValue = event.currentTarget.value;

    }
}, {
    name: "far",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 500000000,
    step: 0,
    defaultValue: entity.point.translucencyByDistance._value.far,
    onchange: function(event) {
        entity.point.translucencyByDistance._value.far = event.currentTarget.value;

    }
}, {
    name: "farValue",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 10,
    step: 0,
    defaultValue: entity.point.translucencyByDistance._value.farValue,
    onchange: function(event) {
        entity.point.translucencyByDistance._value.farValue = event.currentTarget.value;

    }
}]);
//#endregion

//#region
new ToolBar(document.getElementById("distanceDisplayCondition")).addMenus([{
    name: "near",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.distanceDisplayCondition._value.near,
    onchange: function(event) {
        entity.point.distanceDisplayCondition._value.near = event.currentTarget.value;

    }
}, {
    name: "far",
    menuType: ToolBar.MenuType.RANGE,
    minValue: 1,
    maxValue: 5000000,
    step: 0,
    defaultValue: entity.point.distanceDisplayCondition._value.far,
    onchange: function(event) {
        entity.point.distanceDisplayCondition._value.far = event.currentTarget.value;

    }
}]);</script>
    <style>
        html,body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Heiti SC", "Microsoft Yahei",sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</body>

</html>
